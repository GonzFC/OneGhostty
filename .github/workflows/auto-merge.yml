name: Auto-merge Claude branches to main

# Automatically fast-forwards `main` whenever a `claude/**` branch is pushed.
# Claude Code can only push to `claude/*` branches; this workflow takes those
# changes and lands them on `main` so the install URL always serves the latest.

on:
  push:
    branches:
      - 'claude/**'

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout claude branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate shell scripts
        run: |
          for script in install.sh oneghostty.sh; do
            if [ -f "$script" ]; then
              bash -n "$script" || { echo "::error::Syntax error in $script"; exit 1; }
              echo "OK: $script"
            fi
          done

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fast-forward main to ${{ github.ref_name }}
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git checkout main
          git pull origin main
          if git merge --ff-only "origin/$BRANCH"; then
            git push origin main
            echo "::notice::Fast-forwarded main to $BRANCH"
          else
            echo "::error::Could not fast-forward main to $BRANCH (branch has diverged). Manual merge required."
            exit 1
          fi
